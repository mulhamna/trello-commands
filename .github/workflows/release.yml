name: Release

# Triggered by the vX.Y.Z tag that release-please creates. Publishing uses
# OIDC trusted publishing only — no crates.io or npm tokens are stored.
#
# One-time setup (repo owner):
#   - GitHub environment `release` (Settings → Environments).
#   - crates.io → trelloc-core, trelloc-mcp, trelloc → Settings → Trusted
#     Publishing: repo mulhamna/trello-commands, workflow release.yml,
#     environment release.
#   - npmjs.com → @mulham28/trelloc → Settings → Trusted Publisher: GitHub
#     Actions, same repo / workflow / environment.
#   - Secrets (PATs, not publish tokens):
#       PACKAGES_TOKEN        mulhamna/homebrew-tap + mulhamna/scoop-bucket: contents (RW)
#
# `workflow_dispatch` with dry_run=true builds every artifact and publishes
# nothing — use it on a fork to validate the pipeline.

"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to (re)release, e.g. v1.0.0'
        required: true
        type: string
      dry_run:
        description: 'Build only; skip every publish step'
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || !inputs.dry_run }}

jobs:
  # ── 0. Tag must match VERSION, Cargo.toml and the npm package ───────────
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Tag, VERSION, Cargo.toml and npm agree
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          CARGO_VER=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          NPM_VER=$(node -p "require('./packaging/npm/package.json').version")
          echo "tag=$TAG VERSION=$VER Cargo=$CARGO_VER npm=$NPM_VER"
          test "$TAG" = "v$VER"
          test "$CARGO_VER" = "$VER"
          test "$NPM_VER" = "$VER"

      - name: CHANGELOG has an entry
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          # release-please writes "## X.Y.Z (date)" for the first release and
          # "## [X.Y.Z](compare-link) (date)" afterwards; accept both.
          grep -qE "^## \[?${VER//./\\.}[] (]" CHANGELOG.md \
            || { echo "No CHANGELOG entry for $VER"; exit 1; }

  # ── 1. Build the single binary for six targets ──────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: validate-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, name: trelloc-linux-x86_64, ext: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, name: trelloc-linux-aarch64, ext: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-latest, name: trelloc-macos-x86_64, ext: tar.gz }
          - { target: aarch64-apple-darwin, os: macos-latest, name: trelloc-macos-aarch64, ext: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, name: trelloc-windows-x86_64, ext: zip }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, name: trelloc-windows-aarch64, ext: zip }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install Zig + cargo-zigbuild (Linux, glibc 2.17)
        if: runner.os == 'Linux'
        run: |
          pip3 install --require-hashes --break-system-packages -r .github/requirements/ziglang-release.txt
          cargo install cargo-zigbuild --locked

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}.2.17 -p trelloc

      - name: Build (macOS / Windows)
        if: runner.os != 'Linux'
        run: cargo build --locked --release --target ${{ matrix.target }} -p trelloc

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/trelloc dist/${{ matrix.name }}
          cp README.md LICENSE dist/
          tar -czf ${{ matrix.name }}.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/trelloc.exe dist/${{ matrix.name }}.exe
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.name }}.zip

      - name: Build provenance attestation
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.name }}.${{ matrix.ext }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.${{ matrix.ext }}
          if-no-files-found: error

  # ── 2. Attach archives + checksums to the GitHub Release ────────────────
  github-release:
    name: GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: checksums.txt
        working-directory: artifacts
        run: |
          sha256sum trelloc-* | sort -k2 > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: artifacts/checksums.txt

      - name: Upload to release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "trelloc $TAG" --generate-notes
          fi
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

  # ── 3. crates.io via Trusted Publishing ─────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: github-release
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # stable
        with:
          toolchain: stable

      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Order matters: each crate depends on the previous one. Every step is
      # idempotent (skips a version already in the sparse index) so a failed
      # run can be re-run safely.
      - name: Publish trelloc-core → trelloc-mcp → trelloc
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          in_index() {
            curl -sf "https://index.crates.io/tr/el/$1" | grep -q "\"vers\":\"${VER}\""
          }
          for crate in trelloc-core trelloc-mcp trelloc; do
            if in_index "$crate"; then
              echo "✓ $crate $VER already published"
            else
              cargo publish --locked -p "$crate"
            fi
            for i in $(seq 1 30); do
              in_index "$crate" && break
              echo "waiting for $crate $VER in the sparse index ($i/30)"
              sleep 10
            done
            in_index "$crate" || { echo "$crate $VER never appeared in the index"; exit 1; }
          done

  # ── 4. npm via Trusted Publishing ───────────────────────────────────────
  publish-npm:
    name: Publish @mulham28/trelloc
    needs: github-release
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11.19.0

      - name: Publish (skip if already published)
        run: |
          VER=$(node -p "require('./packaging/npm/package.json').version")
          if npm view "@mulham28/trelloc@$VER" version >/dev/null 2>&1; then
            echo "✓ @mulham28/trelloc@$VER already published"
          else
            npm publish ./packaging/npm --access public --provenance
          fi

  # ── 5. Homebrew tap + Scoop bucket ──────────────────────────────────────
  update-packages:
    name: Homebrew / Scoop
    needs: github-release
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: .

      - name: Read version and hashes
        id: v
        run: |
          sha() { awk -v f="$1" '$2 == f { print $1 }' checksums.txt; }
          {
            echo "version=${TAG#v}"
            echo "macos_arm=$(sha trelloc-macos-aarch64.tar.gz)"
            echo "macos_x86=$(sha trelloc-macos-x86_64.tar.gz)"
            echo "linux_arm=$(sha trelloc-linux-aarch64.tar.gz)"
            echo "linux_x86=$(sha trelloc-linux-x86_64.tar.gz)"
            echo "win_x86=$(sha trelloc-windows-x86_64.zip)"
            echo "win_arm=$(sha trelloc-windows-aarch64.zip)"
          } | tee -a "$GITHUB_OUTPUT"

      - name: Write Homebrew formula and Scoop manifest
        env:
          VERSION: ${{ steps.v.outputs.version }}
          MACOS_ARM: ${{ steps.v.outputs.macos_arm }}
          MACOS_X86: ${{ steps.v.outputs.macos_x86 }}
          LINUX_ARM: ${{ steps.v.outputs.linux_arm }}
          LINUX_X86: ${{ steps.v.outputs.linux_x86 }}
          WIN_X86: ${{ steps.v.outputs.win_x86 }}
          WIN_ARM: ${{ steps.v.outputs.win_arm }}
        run: python3 .github/scripts/write_package_manifests.py out

      - name: Push Homebrew formula
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/mulhamna/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/trelloc.rb tap/Formula/trelloc.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/trelloc.rb
          git diff --staged --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "trelloc ${VERSION}"
          git push

      - name: Push Scoop manifest
        env:
          TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/mulhamna/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp out/trelloc.json bucket/bucket/trelloc.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/trelloc.json
          git diff --staged --quiet && { echo "manifest unchanged"; exit 0; }
          git commit -m "trelloc: update to ${VERSION}"
          git push
